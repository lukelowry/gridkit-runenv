# Builds and publishes both GridKit images. Runs automatically on pushes to
# main (.github/workflows/build.yml), or manually from the repo root:
#
#   gcloud builds submit --project=gridkitvm --config=docker/cloudbuild.yaml .

substitutions:
  _IMAGE_REPO: us-central1-docker.pkg.dev/gridkitvm/lattice
  _GRIDKIT_REF: develop
  _SOURCE_REVISION: manual

steps:
  # gridkit-install: scratch artifact the dev container copies from.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=docker/Dockerfile
      - --target=install
      - --tag=${_IMAGE_REPO}/gridkit-install:latest
      - --build-arg=GRIDKIT_REF=${_GRIDKIT_REF}
      - --build-arg=SOURCE_REVISION=${_SOURCE_REVISION}
      - --build-arg=UPSTREAM_CACHE_BUST=${BUILD_ID}
      - .

  # gridkit: the runnable image. Reuses every stage built above, so this
  # step only adds the final Ubuntu layer.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=docker/Dockerfile
      - --target=runtime
      - --tag=${_IMAGE_REPO}/gridkit:latest
      - --build-arg=GRIDKIT_REF=${_GRIDKIT_REF}
      - --build-arg=SOURCE_REVISION=${_SOURCE_REVISION}
      - --build-arg=UPSTREAM_CACHE_BUST=${BUILD_ID}
      - .

  # Also push an immutable date tag, so studies can pin an exact build.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        tag=${_IMAGE_REPO}/gridkit:$$(date -u +%Y%m%d-%H%M%S)
        docker tag ${_IMAGE_REPO}/gridkit:latest "$$tag"
        docker push "$$tag"

images:
  - ${_IMAGE_REPO}/gridkit-install:latest
  - ${_IMAGE_REPO}/gridkit:latest

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: "100"
  logging: CLOUD_LOGGING_ONLY
  env: [DOCKER_BUILDKIT=1]

timeout: 3600s
